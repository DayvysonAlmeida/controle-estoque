# Não é obrigatório informar o "version:" em versões recentes do Docker Compose.
services:
  web:
    build: ./backend          # Caminho para o Dockerfile do Django
    container_name: django_app
    command: gunicorn --bind 0.0.0.0:4000 mybackend.wsgi:application
    volumes:
      - ./backend:/app
    ports:
      - "4000:4000"
    depends_on:
      - mysql
    env_file:
      - .env

  mysql:
    image: mysql:8.0
    container_name: mysql_db
    restart: always
    env_file:
    - ./.env
    ports:
      - "3307:3306"
    volumes:
      - ./mysql_data:/var/lib/mysql

      
  frontend:
    build: ./controle-estoque       # Caminho para o Dockerfile do React
    container_name: react_app
    ports:
      - "3000:80"
    volumes:
      - ./controle-estoque:/app      # Ajuste aqui a montagem do volume para refletir o diretório do código fonte
    environment:
      - CHOKIDAR_USEPOLLING=true     # Ativa o polling para o watcher
      # Se necessário, ajuste outras variáveis como CHOKIDAR_INTERVAL, por exemplo:
      # - CHOKIDAR_INTERVAL=100
    command: npm start                # Comando para iniciar o React em modo de desenvolvimento
    depends_on:
      - web
    restart: always

volumes:
  mysql_data:
    driver: local
